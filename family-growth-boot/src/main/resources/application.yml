spring:
  application:
    name: family-growth
  datasource:
    url: ${FAMILY_GROWTH_DB_URL:jdbc:postgresql://localhost:5432/family_growth}
    username: ${FAMILY_GROWTH_DB_USER:family_growth}
    password: ${FAMILY_GROWTH_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${FAMILY_GROWTH_PORT:8080}
