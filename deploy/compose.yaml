services:
  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_growth
      POSTGRES_USER: ${FAMILY_GROWTH_DB_USER}
      POSTGRES_PASSWORD: ${FAMILY_GROWTH_DB_PASSWORD}
    volumes:
      - family_growth_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FAMILY_GROWTH_DB_URL: jdbc:postgresql://db:5432/family_growth
      FAMILY_GROWTH_DB_USER: ${FAMILY_GROWTH_DB_USER}
      FAMILY_GROWTH_DB_PASSWORD: ${FAMILY_GROWTH_DB_PASSWORD}
      FAMILY_GROWTH_TLS_KEYSTORE: file:/run/secrets/family-growth.p12
      FAMILY_GROWTH_TLS_KEYSTORE_PASSWORD: ${FAMILY_GROWTH_TLS_KEYSTORE_PASSWORD}
      FAMILY_GROWTH_TLS_KEY_ALIAS: ${FAMILY_GROWTH_TLS_KEY_ALIAS:-family-growth}
      FAMILY_GROWTH_PORT: 8443
    ports:
      - "${FAMILY_GROWTH_HTTPS_PORT:-8443}:8443"
    volumes:
      - ${FAMILY_GROWTH_TLS_KEYSTORE_HOST_PATH}:/run/secrets/family-growth.p12:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  family_growth_db:
