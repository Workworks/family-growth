openapi: 3.1.0
info:
  title: Family Growth API
  version: 1.0.0
  description: Stage 3–9、17、20–21 的生产认证、成长任务、家庭账本、纯模拟基金、冻结式零钱回收、Android 同步、学段体验和课程学习证据 API。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/bootstrap:
    post:
      operationId: bootstrapFamily
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      operationId: loginParent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: PIN temporarily locked after repeated failures
  /auth/child-sessions:
    post:
      operationId: createChildSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId]
              properties:
                childId:
                  type: string
                  format: uuid
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/children:
    post:
      operationId: addChild
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChild'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/children/{childId}/plans:
    post:
      operationId: createGrowthPlan
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlan'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/plans/{planId}/goals:
    post:
      operationId: createGrowthGoal
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoal'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/goals/{goalId}/tasks:
    post:
      operationId: createGrowthTask
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/children/{childId}/tasks/{taskId}/completions:
    post:
      operationId: submitTaskCompletion
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evidenceNote:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /families/{familyId}/completions/{completionId}/review:
    post:
      operationId: reviewTaskCompletion
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: completionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCompletion'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /families/{familyId}/children/{childId}/wallet:
    get:
      operationId: getWallet
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/children/{childId}/ledger:
    get:
      operationId: getLedger
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/children/{childId}/wallet/adjustments:
    post:
      operationId: adjustWallet
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAdjustment'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /families/{familyId}/children/{childId}/wallet/reconciliation:
    get:
      operationId: reconcileWallet
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /families/{familyId}/children/{childId}/gift-money:
    post:
      operationId: depositGiftMoney
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftMoneyRequest'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /families/{familyId}/exchange-rules:
    post:
      operationId: createExchangeRule
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRuleRequest'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /families/{familyId}/exchange-rules/active:
    get:
      operationId: getActiveExchangeRule
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /families/{familyId}/children/{childId}/exchange-previews:
    post:
      operationId: previewExchange
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangePreviewRequest'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /families/{familyId}/exchange-previews/{previewId}/confirm:
    post:
      operationId: confirmExchange
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: previewId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /families/{familyId}/reward-products:
    get:
      operationId: listRewardProducts
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: activeOnly, in: query, schema: { type: boolean, default: true } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createRewardProduct
      parameters: [ { $ref: '#/components/parameters/FamilyId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RewardProductRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /families/{familyId}/children/{childId}/reward-orders:
    post:
      operationId: createRewardOrder
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RewardOrderRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/reward-orders/{orderId}/review:
    post:
      operationId: reviewRewardOrder
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [approved], properties: { approved: { type: boolean } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/reward-orders/{orderId}/cancel:
    post:
      operationId: cancelRewardOrder
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/saving:
    get:
      operationId: getSavingAccount
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/saving/transfers:
    post:
      operationId: transferSaving
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavingTransferRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/wishes:
    get:
      operationId: listWishes
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createWish
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WishRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /families/{familyId}/wishes/{wishId}/allocation:
    post:
      operationId: allocateWish
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: wishId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount], properties: { amount: { type: number, minimum: 0, multipleOf: 0.01 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/funds:
    get:
      operationId: listVirtualFunds
      parameters: [ { $ref: '#/components/parameters/FamilyId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createVirtualFund
      parameters: [ { $ref: '#/components/parameters/FamilyId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VirtualFundRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /families/{familyId}/funds/{fundId}/nav:
    post:
      operationId: addFundNav
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { name: fundId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FundNavRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/funds/{fundId}/fee-rules:
    post:
      operationId: createFundFeeRule
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { name: fundId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FundFeeRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/funds/{fundId}/trade-previews:
    post:
      operationId: previewFundTrade
      description: Children in the 3–5 age path are denied; a parent must operate jointly.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { name: fundId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FundTradePreviewRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/fund-trade-previews/{previewId}/confirm:
    post:
      operationId: confirmFundTrade
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { name: previewId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/funds/{fundId}/position:
    get:
      operationId: getFundPosition
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { name: fundId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/withdrawal-rules:
    post:
      operationId: createWithdrawalRule
      description: Parent-only versioned offline-payout rule. This API never transfers real funds.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalRuleRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/withdrawal-rules/active:
    get:
      operationId: getActiveWithdrawalRule
      description: Returns the active family rule; the system default is 1 Money to CNY 1 with zero fee.
      parameters: [ { $ref: '#/components/parameters/FamilyId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/withdrawal-quotes:
    post:
      operationId: createWithdrawalQuote
      description: Creates a ten-minute transparent gross/fee/net quote for an offline family payout.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalQuoteRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/withdrawal-requests:
    get:
      operationId: listWithdrawalRequests
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: submitWithdrawalRequest
      description: Submits an unexpired quote without changing or reserving the wallet balance.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalCreateRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/withdrawal-requests/{requestId}/approve:
    post:
      operationId: approveWithdrawalRequest
      description: Parent-only transition that reserves Money but does not debit it.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/withdrawal-requests/{requestId}/reject:
    post:
      operationId: rejectWithdrawalRequest
      description: Parent-only rejection; no Money is reserved or debited.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/withdrawal-requests/{requestId}/cancel:
    post:
      operationId: cancelWithdrawalRequest
      description: A child may cancel their REQUESTED item; only a parent may release an APPROVED reservation.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/withdrawal-requests/{requestId}/paid:
    post:
      operationId: markWithdrawalPaid
      description: Parent-only confirmation after the offline payout; atomically debits balance and reservation and appends an immutable Money ledger entry.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/sync:
    get:
      operationId: syncChildWorkspace
      description: Returns the authorized child task states, latest completion ids, wallet and daily review summary for the Android client.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/usage-policy:
    get:
      operationId: getUsagePolicy
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      operationId: configureUsagePolicy
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UsagePolicyRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/usage-events:
    post:
      operationId: recordUsageEvent
      description: Records only this App's active or learning minutes. Replays require the same payload and Idempotency-Key.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UsageEventRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/reports/today:
    get:
      operationId: getTodayReport
      description: Child sessions can read only their own age-appropriate today summary.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/reports/monthly:
    get:
      operationId: getMonthlyFamilyReport
      description: Parent-only report aggregated from usage, completion, ledger, saving and simulated-fund fact tables.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: month, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/experience-profile:
    get:
      operationId: getChildExperienceProfile
      description: Returns the server-authoritative birth date, recommended/effective school stage, capability and bounded feedback profile. A child session may read only itself.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      operationId: updateChildExperienceProfile
      description: Parent-only update with optimistic version checking and an immutable audit entry. PARENT_ONLY cannot be selected as an override.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExperienceProfileRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/experience-profile/audit:
    get:
      operationId: listChildExperienceAudit
      description: Parent-only immutable history of birth date, override and haptic-setting changes.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/documentary-sources:
    get:
      operationId: listDocumentarySources
      description: Parent-only rights and lifecycle view. Source references remain visible only to the parent.
      parameters: [ { $ref: '#/components/parameters/FamilyId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createDocumentarySource
      description: Parent-only creation in DRAFT. Official links must be credential-free HTTPS; offline references must use the access-mode-specific scheme.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentarySourceRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/documentaries:
    get:
      operationId: listChildDocumentaries
      description: Lists only approved, unexpired entries for the effective school stage. The child projection never includes a launchable source reference or rights metadata; official links require a parent action.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/documentary-sources/{sourceId}/approve:
    post:
      operationId: approveDocumentarySource
      description: Parent-only idempotent DRAFT to APPROVED transition.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/documentary-sources/{sourceId}/withdraw:
    post:
      operationId: withdrawDocumentarySource
      description: Parent-only idempotent transition that removes a source from the child catalogue without deleting its history.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/education-resource-sources:
    get:
      operationId: listEducationResourceSources
      description: Parent-only source shelf including URLs, discovery state, last safe category snapshot and lifecycle.
      parameters: [ { $ref: '#/components/parameters/FamilyId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createEducationResourceSource
      description: Parent-only DRAFT source creation. Only public HTTPS hostnames on port 443 without credentials, query or fragment are accepted; creation does not fetch the site.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EducationResourceSourceRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/education-resource-sources/{sourceId}/refresh:
    post:
      operationId: refreshEducationResourceSource
      description: Parent-only bounded HTML navigation discovery. DNS and each redirect are revalidated; failure preserves the last successful category snapshot and returns FAILED state.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/education-resource-sources/{sourceId}/approve:
    post:
      operationId: approveEducationResourceSource
      description: Parent-only idempotent approval after a successful non-empty category refresh.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/education-resource-sources/{sourceId}/withdraw:
    post:
      operationId: withdrawEducationResourceSource
      description: Parent-only idempotent withdrawal. History remains stored and the source disappears from child catalogues.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/education-resource-catalog:
    get:
      operationId: listChildEducationResourceCatalog
      description: Returns approved sources for the effective school stage as labels only. Source and category URLs, usage notes and refresh errors are omitted; kindergarten returns an empty list.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/teaching/courses:
    get:
      operationId: listTeachingCourses
      description: Parent-only list of all immutable course versions in the family.
      parameters: [ { $ref: '#/components/parameters/FamilyId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createTeachingCourse
      description: Parent-only atomic creation of a course and its first DRAFT version. Objective answer keys remain server-side and are never included in child projections.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeachingCourseRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/teaching/courses/{courseId}/versions:
    post:
      operationId: createTeachingCourseVersion
      description: Creates a new DRAFT instead of mutating a published version.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeachingVersionRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/teaching/course-versions/{versionId}:
    get:
      operationId: getTeachingCourseVersion
      description: Parent-only read of one immutable course-version tree so an Android client can select a lesson for assignment. Child sessions are forbidden.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/teaching/course-versions/{versionId}/publish:
    post:
      operationId: publishTeachingCourseVersion
      description: Idempotent DRAFT to PUBLISHED transition. Published units, lessons, activities and questions have no mutation API.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/teaching/course-versions/{versionId}/withdraw:
    post:
      operationId: withdrawTeachingCourseVersion
      description: Parent-only immutable withdrawal audit. Stops future manual/automatic assignment without deleting existing assignments, attempts or support evidence.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentWithdrawalRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/learning/assignments:
    get:
      operationId: listChildLearningAssignments
      description: Parent or owning child reads only published assignments matching the server-authoritative effective stage. Answer keys and rights metadata are omitted.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: assignTeachingLesson
      description: Parent-only idempotent assignment of one lesson from a published version matching the child's effective stage.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LessonAssignmentRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/autonomous-learning/reward-policy:
    get:
      operationId: getAutonomousLearningRewardPolicy
      description: Parent-only read of the fixed per-child policy. An absent policy is returned as a zero-valued version 0 default.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      operationId: updateAutonomousLearningRewardPolicy
      description: Parent-only optimistic update with immutable audit. The new policy affects only assignments created after the update.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutonomousRewardPolicyRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/autonomous-learning/sync:
    post:
      operationId: syncAutonomousLearningAssignments
      description: Parent or owning child idempotently enrolls missing lessons only from each course's latest published version matching the server-authoritative effective stage. Reward policy is snapshotted on creation; GET catalog remains read-only.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/autonomous-learning/primary-report:
    get:
      operationId: getPrimaryLearningReport
      description: Parent-only factual summary of preserved primary-school assignments, open support and revisit facts, plus recorded LEARNING minutes in the trailing seven-day window. It contains no score, ability inference, answer key or private note and remains readable after a stage change.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/junior-learning/plan:
    get:
      operationId: getJuniorLearningPlan
      description: Parent or owning child reads the ordered projection of unstarted autonomous junior-middle assignments. In-progress, submitted, completed and rework items are not sortable.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/junior-learning/plan/move:
    post:
      operationId: moveJuniorLearningPlanItem
      description: Parent or owning child idempotently moves one unstarted autonomous junior-middle assignment across the nearest other sortable item. The expected plan revision provides optimistic concurrency and every accepted move is audited immutably.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JuniorPlanMoveRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/junior-learning/report:
    get:
      operationId: getJuniorLearningReport
      description: Parent-only trailing-seven-day factual report of learning minutes, assignment states, open support, revisit facts and the current plan revision. It contains no score, ability inference, answer key or parent private note.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/senior-learning/modules:
    get:
      operationId: getSeniorModuleConfiguration
      description: Parent or owning child reads the server-authoritative senior module boundary. Historical learning facts are preserved after changes.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      operationId: updateSeniorModuleConfiguration
      description: Parent-only idempotent optimistic update with immutable audit. Children cannot enable modules.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SeniorModuleConfigurationRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/senior-learning/goals:
    get:
      operationId: listSeniorWeeklyGoals
      description: Parent or owning child reads preserved factual weekly goals.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createSeniorWeeklyGoal
      description: Owning child creates a goal only inside a parent-enabled module. A goal never settles a reward or creates mastery.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SeniorGoalCreateRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/senior-learning/goals/{goalId}:
    put:
      operationId: updateSeniorWeeklyGoal
      description: Owning child idempotently updates an active goal using optimistic revision.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { name: goalId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SeniorGoalUpdateRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/senior-learning/goals/{goalId}/archive:
    post:
      operationId: archiveSeniorWeeklyGoal
      description: Owning child idempotently archives an active goal; assignment and reward facts remain unchanged.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { name: goalId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/senior-learning/reflections:
    get:
      operationId: listSeniorReflections
      description: Parent or owning child reads immutable evidence-based reflections without ability labels.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createSeniorReflection
      description: Owning child appends an immutable reflection and may explicitly request support. It never changes rewards or mastery.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SeniorReflectionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/senior-learning/report:
    get:
      operationId: getSeniorLearningReport
      description: Parent-only trailing-seven-day factual report of learning minutes, assignment states, goals, reflections and support requests; no score, prediction, risk or ability inference.
      parameters: [ { $ref: '#/components/parameters/FamilyId' }, { $ref: '#/components/parameters/ChildId' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/autonomous-learning/assignments/{assignmentId}/activities/{activityId}/help:
    post:
      operationId: requestLearningHelp
      description: Owning child only. Appends an immutable help fact without creating an attempt, mastery evidence, assignment transition or version change.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningHelpRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/autonomous-learning/assignments/{assignmentId}/support-events:
    get:
      operationId: listLearningSupportEvents
      description: Parent or owning child reads the immutable process timeline. Child responses always redact parent private notes and never include answer keys.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /families/{familyId}/children/{childId}/autonomous-learning/assignments/{assignmentId}/support-events/classify:
    post:
      operationId: classifyLearningSupport
      description: Parent-only classification of an existing help/incorrect fact, optionally scheduling a revisit 1 to 30 days later. Labels describe the learning process, not ability or personality.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningSupportClassifyRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/learning/assignments/{assignmentId}/activities/{activityId}/attempts:
    post:
      operationId: recordLearningActivityAttempt
      description: Owning child only. Video requires at least 90% actual playback counters and produces VIEWED; objective answers are checked on the server; parent-required activities produce ATTEMPTED.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningAttemptRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/learning/assignments/{assignmentId}/submit:
    post:
      operationId: submitLearningAssignment
      description: Owning child only; all child-side required evidence must exist, expectedVersion must match, and a reworked assignment requires a new attempt after the rework request.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /families/{familyId}/children/{childId}/learning/assignments/{assignmentId}/review:
    post:
      operationId: reviewLearningAssignment
      description: Parent-only APPROVE or REWORK. Approval appends PARENT_CONFIRMED/MASTERED and atomically settles the assignment's fixed XP/Money/Coin snapshot once; Money/Coin each require an immutable LEARNING_ASSIGNMENT ledger entry.
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/ChildId'
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningReviewRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    FamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
  responses:
    Ok:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Created:
      description: Resource created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: Missing, invalid or expired Bearer session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: Authenticated role cannot perform this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: Resource does not exist or is not visible in this family scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
  schemas:
    SchoolStage:
      type: string
      enum: [PARENT_ONLY, KINDERGARTEN, PRIMARY, JUNIOR_MIDDLE, SENIOR_HIGH]
    PrimaryGradeBand:
      type: string
      enum: [LOWER_PRIMARY, UPPER_PRIMARY]
    ExperienceProfileRequest:
      type: object
      required: [birthDate, hapticsEnabled, expectedVersion, auditReason]
      properties:
        birthDate: { type: string, format: date }
        stageOverride:
          oneOf:
            - { $ref: '#/components/schemas/SchoolStage' }
            - { type: 'null' }
        primaryBandOverride:
          oneOf:
            - { $ref: '#/components/schemas/PrimaryGradeBand' }
            - { type: 'null' }
        overrideReason: { type: [string, 'null'], maxLength: 240 }
        hapticsEnabled: { type: boolean }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        auditReason: { type: string, minLength: 1, maxLength: 240 }
    DocumentarySourceRequest:
      type: object
      required: [schoolStage, title, languageTag, accessMode, sourceReference, rightsHolder, rightsReference]
      properties:
        schoolStage: { $ref: '#/components/schemas/SchoolStage' }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 1000 }
        languageTag: { type: string, pattern: '^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$' }
        durationSeconds: { type: [integer, 'null'], minimum: 10, maximum: 14400 }
        accessMode: { type: string, enum: [ORIGINAL_OFFLINE, LICENSED_OFFLINE, OFFICIAL_LINK] }
        sourceReference: { type: string, minLength: 1, maxLength: 1000 }
        rightsHolder: { type: string, minLength: 1, maxLength: 240 }
        rightsReference: { type: string, minLength: 1, maxLength: 1000 }
        licenseExpiresOn: { type: [string, 'null'], format: date }
    EducationResourceSourceRequest:
      type: object
      required: [title, sourceUrl, schoolStages, usageNote]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        sourceUrl: { type: string, format: uri, minLength: 1, maxLength: 1000, pattern: '^https://[^?#]+$' }
        schoolStages:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/SchoolStage' }
        usageNote: { type: string, minLength: 1, maxLength: 500 }
    ActivityType:
      type: string
      enum: [SHORT_VIDEO, PARENT_CHILD_READING, LISTEN_CHOOSE, SINGLE_CHOICE, MATCHING, SORTING, ORAL_RESPONSE, OFFLINE_PRACTICE, PARENT_CONFIRMATION]
    TeachingOptionRequest:
      type: object
      required: [value, label]
      properties:
        value: { type: string, minLength: 1, maxLength: 160 }
        label: { type: string, minLength: 1, maxLength: 240 }
    TeachingActivityRequest:
      type: object
      required: [type, title, instruction, expectedMinutes]
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        title: { type: string, minLength: 1, maxLength: 160 }
        instruction: { type: string, minLength: 1, maxLength: 500 }
        contentRef: { type: [string, 'null'], enum: [lesson_color_garden, lesson_count_to_five, lesson_shape_home, null], description: Required only for SHORT_VIDEO and must name a bundled reviewed asset. }
        expectedMinutes: { type: integer, minimum: 1, maximum: 60 }
        prompt: { type: [string, 'null'], maxLength: 500 }
        hint: { type: [string, 'null'], maxLength: 300 }
        options: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/TeachingOptionRequest' } }
        answerKey: { type: [string, 'null'], maxLength: 1000, writeOnly: true }
    TeachingLessonRequest:
      type: object
      required: [title, summary, activities]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        summary: { type: string, minLength: 1, maxLength: 500 }
        chapterTitle: { type: [string, 'null'], minLength: 1, maxLength: 160, description: Required at publication for JUNIOR_MIDDLE and forbidden for other stages. }
        knowledgePoints: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 80 }, description: Required at publication for JUNIOR_MIDDLE and forbidden for other stages. }
        learningGoal: { type: [string, 'null'], minLength: 1, maxLength: 500, description: Required at publication for JUNIOR_MIDDLE and forbidden for other stages. }
        safetyNote: { type: [string, 'null'], minLength: 1, maxLength: 500, description: Required at publication for JUNIOR_MIDDLE. High-risk home experiment guidance is rejected. }
        moduleType: { type: [string, 'null'], enum: [REQUIRED, SELECTIVE_REQUIRED, ELECTIVE, null], description: Required at publication for SENIOR_HIGH and forbidden for other stages. }
        topicTitle: { type: [string, 'null'], minLength: 1, maxLength: 160, description: Required at publication for SENIOR_HIGH. }
        inquiryQuestion: { type: [string, 'null'], minLength: 1, maxLength: 500, description: Required at publication for SENIOR_HIGH. }
        expectedEvidence: { type: [string, 'null'], minLength: 1, maxLength: 500, description: Required at publication for SENIOR_HIGH. }
        seniorSafetyNote: { type: [string, 'null'], minLength: 1, maxLength: 500, description: Required at publication for SENIOR_HIGH. High-risk or manipulative guidance is rejected. }
        activities: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/TeachingActivityRequest' } }
    SeniorModuleSelection:
      type: object
      required: [subjectCode, moduleType]
      properties:
        subjectCode: { type: string, pattern: '^[A-Z0-9_-]+$', maxLength: 40 }
        moduleType: { type: string, enum: [REQUIRED, SELECTIVE_REQUIRED, ELECTIVE] }
    SeniorModuleConfigurationRequest:
      type: object
      required: [selections, expectedRevision, reason]
      properties:
        selections: { type: array, minItems: 1, maxItems: 12, uniqueItems: true, items: { $ref: '#/components/schemas/SeniorModuleSelection' } }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    SeniorGoalCreateRequest:
      type: object
      required: [module, weekStart, title, evidenceTarget, nextAction]
      properties:
        assignmentId: { type: [string, 'null'], format: uuid }
        module: { $ref: '#/components/schemas/SeniorModuleSelection' }
        weekStart: { type: string, format: date }
        title: { type: string, minLength: 1, maxLength: 160 }
        evidenceTarget: { type: string, minLength: 1, maxLength: 500 }
        nextAction: { type: string, minLength: 1, maxLength: 500 }
    SeniorGoalUpdateRequest:
      type: object
      required: [title, evidenceTarget, nextAction, expectedRevision]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        evidenceTarget: { type: string, minLength: 1, maxLength: 500 }
        nextAction: { type: string, minLength: 1, maxLength: 500 }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    RevisionRequest:
      type: object
      required: [expectedRevision]
      properties: { expectedRevision: { type: integer, format: int64, minimum: 0 } }
    SeniorReflectionRequest:
      type: object
      required: [evidenceSummary, strategy, nextAction, supportRequested]
      properties:
        goalId: { type: [string, 'null'], format: uuid }
        assignmentId: { type: [string, 'null'], format: uuid }
        evidenceSummary: { type: string, minLength: 1, maxLength: 1000 }
        strategy: { type: string, enum: [CONTINUE, REVIEW_FOUNDATION, TRY_ANOTHER_METHOD, ASK_FOR_SUPPORT, PAUSE_AND_REPLAN] }
        nextAction: { type: string, minLength: 1, maxLength: 500 }
        supportRequested: { type: boolean }
    TeachingUnitRequest:
      type: object
      required: [title, lessons]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        lessons: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/TeachingLessonRequest' } }
    TeachingVersionRequest:
      type: object
      required: [summary, rightsBasis, units]
      properties:
        summary: { type: string, minLength: 1, maxLength: 500 }
        rightsBasis: { type: string, minLength: 1, maxLength: 500 }
        kindergartenAgeBand:
          type: [string, 'null']
          enum: [SHARED_3_4, TRANSITION_5_6, null]
          description: Required at publication for KINDERGARTEN and forbidden for other stages.
        kindergartenDomains:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [HEALTH, LANGUAGE, SOCIAL, SCIENCE, ARTS] }
          description: At least one value is required at publication for KINDERGARTEN and forbidden for other stages.
        units: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/TeachingUnitRequest' } }
    TeachingCourseRequest:
      type: object
      required: [schoolStage, subjectCode, title, version]
      properties:
        schoolStage: { $ref: '#/components/schemas/SchoolStage' }
        subjectCode: { type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 40 }
        title: { type: string, minLength: 1, maxLength: 160 }
        version: { $ref: '#/components/schemas/TeachingVersionRequest' }
    LessonAssignmentRequest:
      type: object
      required: [courseVersionId, lessonId]
      properties:
        courseVersionId: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
    JuniorPlanMoveRequest:
      type: object
      required: [assignmentId, direction, expectedRevision]
      properties:
        assignmentId: { type: string, format: uuid }
        direction: { type: string, enum: [UP, DOWN] }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    LearningAttemptRequest:
      type: object
      properties:
        responseText: { type: [string, 'null'], maxLength: 1000 }
        playedSeconds: { type: [integer, 'null'], minimum: 0 }
        durationSeconds: { type: [integer, 'null'], minimum: 1 }
    ContentWithdrawalRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    LearningHelpRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 160 }
    LearningSupportClassifyRequest:
      type: object
      required: [sourceEventId, category]
      properties:
        sourceEventId: { type: string, format: uuid }
        category: { type: string, enum: [INSTRUCTION, CONCEPT, PROCEDURE, LANGUAGE, ATTENTION, OTHER] }
        privateNote: { type: [string, 'null'], maxLength: 500, writeOnly: true }
        revisitAt: { type: [string, 'null'], format: date-time, description: Must be 1 to 30 days after the request. }
    ExpectedVersionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    LearningReviewRequest:
      type: object
      required: [decision, expectedVersion]
      properties:
        decision: { type: string, enum: [APPROVE, REWORK] }
        note: { type: [string, 'null'], maxLength: 500 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    AutonomousRewardPolicyRequest:
      type: object
      required: [moneyReward, coinReward, xpReward, expectedVersion, auditReason]
      properties:
        moneyReward: { type: number, multipleOf: 0.01, minimum: 0, maximum: 10000 }
        coinReward: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
        xpReward: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        auditReason: { type: string, minLength: 1, maxLength: 500 }
    PrimaryLearningReport:
      type: object
      required: [childId, effectiveStage, windowStart, windowEnd, recordedLearningMinutes, subjects, generatedAt]
      properties:
        childId: { type: string, format: uuid }
        effectiveStage: { type: string, enum: [PARENT_ONLY, KINDERGARTEN, PRIMARY, JUNIOR_MIDDLE, SENIOR_HIGH] }
        effectivePrimaryBand: { type: [string, 'null'], enum: [LOWER_PRIMARY, UPPER_PRIMARY, null] }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        recordedLearningMinutes: { type: integer, format: int64, minimum: 0 }
        subjects:
          type: array
          items:
            type: object
            required: [subjectCode, assigned, inProgress, submitted, completed, reworkRequired, openSupport, scheduledRevisits, dueRevisits]
            properties:
              subjectCode: { type: string }
              assigned: { type: integer, format: int64, minimum: 0 }
              inProgress: { type: integer, format: int64, minimum: 0 }
              submitted: { type: integer, format: int64, minimum: 0 }
              completed: { type: integer, format: int64, minimum: 0 }
              reworkRequired: { type: integer, format: int64, minimum: 0 }
              openSupport: { type: integer, format: int64, minimum: 0 }
              scheduledRevisits: { type: integer, format: int64, minimum: 0 }
              dueRevisits: { type: integer, format: int64, minimum: 0 }
        generatedAt: { type: string, format: date-time }
    BootstrapRequest:
      type: object
      required: [familyName, parentName, pin]
      properties:
        familyName:
          type: string
          minLength: 1
          maxLength: 100
        parentName:
          type: string
          minLength: 1
          maxLength: 80
        pin:
          type: string
          pattern: '^\\d{6}$'
          writeOnly: true
    LoginRequest:
      type: object
      required: [familyId, parentId, pin]
      properties:
        familyId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        pin:
          type: string
          pattern: '^\\d{6}$'
          writeOnly: true
    CreateChild:
      type: object
      required: [displayName, birthDate, ageStage]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        birthDate:
          type: string
          format: date
        ageStage:
          type: string
          enum: [INFANT_0_2, EARLY_CHILDHOOD_2_5, CHILD_6_9, PRETEEN_10_12, TEEN_13_PLUS]
    CreatePlan:
      type: object
      required: [title, startDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 1000
        startDate:
          type: string
          format: date
        endDate:
          type: [string, 'null']
          format: date
    CreateGoal:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 1000
    CreateTask:
      type: object
      required: [title, category, difficulty, expectedMinutes]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 1000
        category:
          type: string
          enum: [LEARNING, READING, EXERCISE, HABIT, CHORE, SELF_CARE, PARENT_CHILD]
        difficulty:
          type: string
          enum: [EASY, NORMAL, HARD]
        expectedMinutes:
          type: integer
          minimum: 1
          maximum: 480
    ReviewCompletion:
      type: object
      required: [approved, xpReward, coinReward, moneyReward]
      properties:
        approved:
          type: boolean
        xpReward:
          type: integer
          format: int64
          minimum: 0
        coinReward:
          type: integer
          format: int64
          minimum: 0
        moneyReward:
          type: number
          multipleOf: 0.01
          minimum: 0
        reviewNote:
          type: [string, 'null']
          maxLength: 1000
    WalletAdjustment:
      type: object
      required: [assetType, delta, reason]
      properties:
        assetType:
          type: string
          enum: [MONEY, COIN]
        delta:
          type: number
        reason:
          type: string
          minLength: 1
          maxLength: 500
    GiftMoneyRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 0.01, maximum: 100000, multipleOf: 0.01 }
        note: { type: [string, 'null'], maxLength: 500 }
    ExchangeRuleRequest:
      type: object
      required: [moneyToCoinRate, coinToMoneyRate, moneyToCoinFeeRate, coinToMoneyFeeRate, maxSourceAmount]
      properties:
        moneyToCoinRate: { type: number, exclusiveMinimum: 0 }
        coinToMoneyRate: { type: number, exclusiveMinimum: 0 }
        moneyToCoinFeeRate: { type: number, minimum: 0, exclusiveMaximum: 1 }
        coinToMoneyFeeRate: { type: number, minimum: 0, exclusiveMaximum: 1 }
        maxSourceAmount: { type: number, minimum: 0.01, multipleOf: 0.01 }
    ExchangePreviewRequest:
      type: object
      required: [direction, sourceAmount]
      properties:
        direction: { type: string, enum: [MONEY_TO_COIN, COIN_TO_MONEY] }
        sourceAmount: { type: number, minimum: 0.01, multipleOf: 0.01 }
    RewardProductRequest:
      type: object
      required: [title, coinCost, stockCount, active]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        coinCost: { type: integer, format: int64, minimum: 1 }
        stockCount: { type: integer, minimum: 0, maximum: 1000000 }
        active: { type: boolean }
    RewardOrderRequest:
      type: object
      required: [productId]
      properties: { productId: { type: string, format: uuid } }
    SavingTransferRequest:
      type: object
      required: [direction, amount]
      properties:
        direction: { type: string, enum: [DEPOSIT, WITHDRAW] }
        amount: { type: number, minimum: 0.01, multipleOf: 0.01 }
    WishRequest:
      type: object
      required: [title, targetAmount]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        targetAmount: { type: number, minimum: 0.01, multipleOf: 0.01 }
    VirtualFundRequest:
      type: object
      required: [name, riskLabel]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        riskLabel: { type: string, minLength: 1, maxLength: 80 }
    FundNavRequest:
      type: object
      required: [navDate, nav]
      properties:
        navDate: { type: string, format: date }
        nav: { type: number, minimum: 0.000001, multipleOf: 0.000001 }
    FundFeeRequest:
      type: object
      required: [buyFeeRate, sellFeeRate]
      properties:
        buyFeeRate: { type: number, minimum: 0, exclusiveMaximum: 1 }
        sellFeeRate: { type: number, minimum: 0, exclusiveMaximum: 1 }
    FundTradePreviewRequest:
      type: object
      required: [side, inputAmount]
      properties:
        side: { type: string, enum: [BUY, SELL] }
        inputAmount: { type: number, minimum: 0.00000001 }
    WithdrawalRuleRequest:
      type: object
      required: [payoutRate, feeRate, fixedFee]
      properties:
        payoutRate: { type: number, minimum: 0.000001, multipleOf: 0.000001, description: CNY gross payout per Money }
        feeRate: { type: number, minimum: 0, exclusiveMaximum: 1, multipleOf: 0.000001 }
        fixedFee: { type: number, minimum: 0, multipleOf: 0.01 }
    WithdrawalQuoteRequest:
      type: object
      required: [moneyAmount]
      properties:
        moneyAmount: { type: number, minimum: 0.01, maximum: 100000, multipleOf: 0.01 }
    WithdrawalCreateRequest:
      type: object
      required: [quoteId]
      properties:
        quoteId: { type: string, format: uuid }
    UsagePolicyRequest:
      type: object
      required: [zoneId, dailyLimitMinutes, sessionLimitMinutes]
      properties:
        zoneId: { type: string, minLength: 1, maxLength: 60, example: Asia/Shanghai }
        dailyLimitMinutes: { type: integer, minimum: 10, maximum: 480 }
        sessionLimitMinutes: { type: integer, minimum: 5, maximum: 240 }
    UsageEventRequest:
      type: object
      required: [type, minutes, occurredAt]
      properties:
        type: { type: string, enum: [APP_ACTIVE, LEARNING] }
        minutes: { type: integer, minimum: 1, maximum: 60 }
        occurredAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ApiResponse:
      type: object
      required: [data, error, traceId]
      properties:
        data: {}
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        traceId:
          type: [string, 'null']
